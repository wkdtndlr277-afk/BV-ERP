# Cloudflare Pages 자동 배포
# - main 브랜치에 반영되면 → 운영 사이트(bv-erp.pages.dev)에 배포
# - 다른 브랜치(수정 작업용)에 올리면 → 미리보기 주소에 배포 (운영 사이트는 그대로)
# DB 마이그레이션은 자동 실행하지 않음 (운영 데이터 보호). 필요할 때 수동 실행 워크플로를 사용.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # 시크릿을 붙여 넣을 때 섞여 들어간 줄바꿈·공백·다른 글자를 걸러 낸다
      - name: Clean credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN=$(printf '%s' "$RAW_TOKEN" | grep -oE 'cfut_[A-Za-z0-9_-]+' | head -n1 || true)
          if [ -z "$TOKEN" ]; then
            TOKEN=$(printf '%s\n' "$RAW_TOKEN" | grep -v '^[[:space:]]*$' | grep -v -i 'curl\|authorization\|bearer' | head -n1 | tr -d '[:space:]')
          fi
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | grep -oE '[0-9a-f]{32}' | head -n1 || true)
          [ -n "$TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 비어 있음"; exit 1; }
          [ -n "$ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID 시크릿에서 32자리 계정 ID를 찾지 못함"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "token length: ${#TOKEN}"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name=bv-erp --branch="${GITHUB_REF_NAME}" --commit-dirty=true
