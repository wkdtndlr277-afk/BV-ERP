<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>공정 스캔 - 본비반트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overscroll-behavior: none;
        }
        .scan-input {
            font-size: 24px;
            padding: 24px;
            border: 4px solid #10b981;
            border-radius: 20px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 3px;
        }
        .scan-input:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.3);
        }
        .timer-display {
            font-family: 'Courier New', monospace;
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 4px;
        }
        @media (max-width: 400px) {
            .timer-display { font-size: 56px; }
        }
        .process-btn {
            padding: 28px;
            border-radius: 20px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .process-btn:active {
            transform: scale(0.96);
        }
        .process-step {
            display: flex;
            align-items: center;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 10px;
        }
        .process-step.completed {
            background: #d1fae5;
            color: #065f46;
        }
        .process-step.current {
            background: #fef3c7;
            color: #92400e;
            border: 3px solid #f59e0b;
        }
        .process-step.pending {
            background: #f3f4f6;
            color: #9ca3af;
        }
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px;
            border-radius: 16px;
            color: white;
            font-weight: 700;
            font-size: 18px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-normal { color: #10b981; }
        .status-warning { color: #f59e0b; }
        .status-delayed { color: #ef4444; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-emerald-600 to-green-600 text-white p-4 sticky top-0 z-50">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-industry text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold">공정 스캔</h1>
                    <p class="text-sm text-emerald-100">고정 바코드 기반</p>
                </div>
            </div>
            <a href="/" class="p-3 bg-white/20 rounded-xl">
                <i class="fas fa-home text-xl"></i>
            </a>
        </div>
    </header>

    <main class="p-4 pb-32">
        <!-- 스캔 섹션 -->
        <div id="scanSection" class="bg-white rounded-3xl p-6 shadow-xl mb-4">
            <label class="block text-lg font-bold text-gray-700 mb-4 text-center">
                <i class="fas fa-barcode mr-2 text-emerald-600"></i> 바코드 스캔
            </label>
            <input type="text" id="barcodeInput" class="scan-input w-full" 
                   placeholder="바코드를 스캔하세요"
                   autocomplete="off"
                   autofocus>
            <p class="text-sm text-gray-500 mt-4 text-center">
                <i class="fas fa-info-circle mr-1"></i>
                바코드 스캔 → 자동으로 새 사이클 시작 + 타이머 시작
            </p>
        </div>

        <!-- 공정 진행 섹션 (스캔 후 표시) -->
        <div id="processSection" class="hidden">
            <!-- 제품/성형명 정보 -->
            <div class="bg-white rounded-3xl p-5 shadow-xl mb-4">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs bg-purple-100 text-purple-700 px-3 py-1 rounded-full font-bold">
                            <i class="fas fa-shapes mr-1"></i> 성형명
                        </span>
                        <h2 id="shapingName" class="text-2xl font-bold text-gray-800 mt-2">-</h2>
                        <p id="barcodeDisplay" class="text-sm text-gray-500 font-mono mt-1">-</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-500">사이클 #</p>
                        <p id="cycleNumber" class="text-2xl font-bold text-emerald-600">1</p>
                    </div>
                </div>
            </div>

            <!-- 현재 공정 + 타이머 -->
            <div id="timerSection" class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-3xl p-6 shadow-xl mb-4 border-3 border-amber-300">
                <div class="text-center mb-3">
                    <span class="text-sm text-amber-700 font-bold">
                        <i class="fas fa-play-circle mr-1 pulse"></i> 현재 공정
                    </span>
                    <h3 id="currentProcessName" class="text-3xl font-bold text-amber-800 mt-2">-</h3>
                    <p class="text-amber-600 mt-1">
                        <span id="processOrder">1</span> / <span id="totalProcesses">1</span> 공정
                    </p>
                </div>
                
                <!-- 타이머 -->
                <div class="text-center my-6">
                    <div id="timerDisplay" class="timer-display text-amber-600">00:00:00</div>
                    <p id="statusMessage" class="text-lg font-bold mt-3 status-normal">
                        ✓ 정상 진행 중
                    </p>
                </div>
                
                <!-- 종료 버튼 -->
                <button id="endProcessBtn" onclick="endCurrentProcess()" class="process-btn bg-red-500 text-white hover:bg-red-600">
                    <i class="fas fa-stop-circle mr-3"></i> 공정 종료
                </button>
            </div>

            <!-- 전체 완료 섹션 -->
            <div id="completedSection" class="hidden bg-gradient-to-br from-green-50 to-emerald-50 rounded-3xl p-8 shadow-xl mb-4 border-3 border-green-400">
                <div class="text-center">
                    <i class="fas fa-check-circle text-7xl text-green-500 mb-4"></i>
                    <h3 class="text-3xl font-bold text-green-800">모든 공정 완료!</h3>
                    <p class="text-green-600 mt-2 text-lg">총 소요시간: <span id="totalTime">-</span></p>
                    <p class="text-gray-500 mt-4 text-sm">다음 바코드를 스캔하면 새 사이클이 시작됩니다</p>
                </div>
            </div>

            <!-- 공정 목록 -->
            <div class="bg-white rounded-3xl p-5 shadow-xl">
                <h4 class="text-sm font-bold text-gray-600 mb-4">
                    <i class="fas fa-list-ol mr-2"></i> 공정 진행 현황
                </h4>
                <div id="processList">
                    <!-- 동적으로 생성 -->
                </div>
            </div>

            <!-- 새 스캔 버튼 -->
            <button onclick="resetScan()" class="mt-4 w-full py-5 bg-gray-200 text-gray-700 rounded-2xl font-bold text-lg">
                <i class="fas fa-redo mr-2"></i> 다른 바코드 스캔
            </button>
        </div>
    </main>

    <script>
        const API_BASE = '/api/process-tracking';
        
        // 현재 상태
        let currentCycle = null;
        let currentProcessIndex = 0;
        let processes = [];
        let timerInterval = null;
        let processStartTime = null;
        let cycleStartTime = null;

        // 바코드 입력 이벤트
        document.getElementById('barcodeInput').addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const barcode = this.value.trim();
                if (barcode) {
                    await scanBarcode(barcode);
                    this.value = '';
                }
            }
        });

        // 바코드 스캔 → 새 사이클 시작
        async function scanBarcode(barcode) {
            try {
                showLoading(true);
                
                // 1. 바코드 마스터에서 성형명 조회
                const barcodeRes = await fetch(`${API_BASE}/barcode/${encodeURIComponent(barcode)}`);
                const barcodeData = await barcodeRes.json();
                
                if (!barcodeData.success) {
                    showToast('등록되지 않은 바코드입니다', 'error');
                    return;
                }
                
                // API 응답 구조: { success, data: { barcode: {...}, active_cycle, current_process, time_logs } }
                const barcodeInfo = barcodeData.data.barcode;
                const shaping_code = barcodeInfo.shaping_code;
                const shaping_name = barcodeInfo.shaping_name;
                
                if (!shaping_code) {
                    showToast('성형명이 연결되지 않은 바코드입니다', 'error');
                    return;
                }
                
                // 2. 성형명 공정 라우팅 조회
                const routingRes = await fetch(`${API_BASE}/shaping-routing/${shaping_code}`);
                const routingData = await routingRes.json();
                
                if (!routingData.success || !routingData.data.length) {
                    showToast('공정 라우팅이 설정되지 않았습니다', 'error');
                    return;
                }
                
                processes = routingData.data;
                
                // 3. 새 사이클 시작 API 호출
                const cycleRes = await fetch(`${API_BASE}/cycle/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode })
                });
                const cycleData = await cycleRes.json();
                
                if (!cycleData.success) {
                    showToast(cycleData.error || '사이클 시작 실패', 'error');
                    return;
                }
                
                currentCycle = cycleData.data;
                currentProcessIndex = 0;
                cycleStartTime = new Date();
                
                // 기존 사이클인 경우 진행 중인 공정 찾기
                if (currentCycle.is_existing && barcodeData.data.time_logs) {
                    const inProgressIndex = barcodeData.data.time_logs.findIndex(t => t.status === 'IN_PROGRESS');
                    if (inProgressIndex >= 0) {
                        currentProcessIndex = inProgressIndex;
                        processes = barcodeData.data.time_logs.map(t => ({
                            ...t,
                            status: t.status
                        }));
                    }
                }
                
                // 4. 첫 번째 공정 자동 시작 (기존 진행 중인 공정이 없는 경우만)
                if (!currentCycle.is_existing || !barcodeData.data.current_process) {
                    await startNextProcess();
                } else {
                    // 진행 중인 공정이 있으면 타이머만 시작
                    processStartTime = new Date(barcodeData.data.current_process.start_time);
                    startTimer();
                    updateProcessDisplay();
                }
                
                // 5. UI 표시
                displayCycleInfo(barcode, shaping_name);
                
                const cycleNum = currentCycle.cycle_id || currentCycle.cycle_number || '1';
                showToast(`${shaping_name} - 사이클 시작!`, 'success');
                
            } catch (error) {
                console.error('Scan error:', error);
                showToast('스캔 오류: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // 다음 공정 시작
        async function startNextProcess() {
            if (currentProcessIndex >= processes.length) {
                // 모든 공정 완료
                showCompletedSection();
                return;
            }
            
            const process = processes[currentProcessIndex];
            
            try {
                const res = await fetch(`${API_BASE}/cycle/process/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cycle_id: currentCycle.cycle_id,
                        process_code: process.process_code,
                        process_order: currentProcessIndex + 1
                    })
                });
                
                const data = await res.json();
                if (!data.success) {
                    console.error('Process start error:', data.error);
                }
                
                // 타이머 시작
                processStartTime = new Date();
                startTimer();
                
                // UI 업데이트
                updateProcessDisplay();
                
            } catch (error) {
                console.error('Start process error:', error);
            }
        }

        // 현재 공정 종료
        async function endCurrentProcess() {
            if (!currentCycle || currentProcessIndex >= processes.length) return;
            
            const process = processes[currentProcessIndex];
            
            try {
                showLoading(true);
                
                // 타이머 정지
                stopTimer();
                
                // 소요시간 계산
                const elapsedSeconds = Math.floor((new Date() - processStartTime) / 1000);
                
                // API 호출
                const res = await fetch(`${API_BASE}/cycle/process/end`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cycle_id: currentCycle.cycle_id,
                        process_code: process.process_code,
                        elapsed_seconds: elapsedSeconds
                    })
                });
                
                const data = await res.json();
                if (!data.success) {
                    showToast(data.error || '공정 종료 실패', 'error');
                    return;
                }
                
                // 완료 표시
                processes[currentProcessIndex].status = 'COMPLETED';
                processes[currentProcessIndex].elapsed_seconds = elapsedSeconds;
                
                // 다음 공정으로
                currentProcessIndex++;
                
                if (currentProcessIndex >= processes.length) {
                    // 모든 공정 완료
                    await completeCycle();
                    showCompletedSection();
                    showToast('모든 공정 완료!', 'success');
                } else {
                    // 다음 공정 시작
                    await startNextProcess();
                    showToast(`${processes[currentProcessIndex].process_name || processes[currentProcessIndex].process_code} 공정 시작`, 'success');
                }
                
            } catch (error) {
                console.error('End process error:', error);
                showToast('공정 종료 오류', 'error');
            } finally {
                showLoading(false);
            }
        }

        // 사이클 완료
        async function completeCycle() {
            if (!currentCycle) return;
            
            const totalSeconds = Math.floor((new Date() - cycleStartTime) / 1000);
            
            try {
                await fetch(`${API_BASE}/cycle/end`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cycle_id: currentCycle.cycle_id,
                        total_seconds: totalSeconds
                    })
                });
            } catch (error) {
                console.error('Complete cycle error:', error);
            }
        }

        // UI 표시: 사이클 정보
        function displayCycleInfo(barcode, shapingName) {
            document.getElementById('shapingName').textContent = shapingName || '-';
            document.getElementById('barcodeDisplay').textContent = barcode || '-';
            document.getElementById('cycleNumber').textContent = currentCycle.cycle_id || currentCycle.cycle_number || '1';
            document.getElementById('totalProcesses').textContent = processes.length;
            
            document.getElementById('scanSection').classList.add('hidden');
            document.getElementById('processSection').classList.remove('hidden');
            document.getElementById('timerSection').classList.remove('hidden');
            document.getElementById('completedSection').classList.add('hidden');
            
            updateProcessDisplay();
        }

        // UI 업데이트: 공정 표시
        function updateProcessDisplay() {
            const process = processes[currentProcessIndex];
            
            document.getElementById('currentProcessName').textContent = 
                process.process_name || process.process_code;
            document.getElementById('processOrder').textContent = currentProcessIndex + 1;
            
            // 공정 목록
            renderProcessList();
        }

        // 공정 목록 렌더링
        function renderProcessList() {
            const container = document.getElementById('processList');
            container.innerHTML = processes.map((p, idx) => {
                let statusClass = 'pending';
                let icon = 'far fa-circle';
                let timeInfo = `표준 ${p.standard_minutes || 60}분`;
                
                if (p.status === 'COMPLETED') {
                    statusClass = 'completed';
                    icon = 'fas fa-check-circle';
                    const mins = Math.floor(p.elapsed_seconds / 60);
                    const secs = p.elapsed_seconds % 60;
                    timeInfo = `${mins}분 ${secs}초 소요`;
                } else if (idx === currentProcessIndex) {
                    statusClass = 'current';
                    icon = 'fas fa-play-circle pulse';
                    timeInfo = '진행 중...';
                }
                
                return `
                    <div class="process-step ${statusClass}">
                        <i class="${icon} text-xl mr-4"></i>
                        <div class="flex-1">
                            <div class="font-bold text-lg">${idx + 1}. ${p.process_name || p.process_code}</div>
                            <div class="text-sm opacity-70">${timeInfo}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 완료 섹션 표시
        function showCompletedSection() {
            document.getElementById('timerSection').classList.add('hidden');
            document.getElementById('completedSection').classList.remove('hidden');
            
            // 총 소요시간
            const totalSeconds = Math.floor((new Date() - cycleStartTime) / 1000);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('totalTime').textContent = `${mins}분 ${secs}초`;
            
            renderProcessList();
        }

        // 타이머 시작
        function startTimer() {
            stopTimer();
            
            timerInterval = setInterval(() => {
                const now = new Date();
                const elapsed = Math.floor((now - processStartTime) / 1000);
                const hours = Math.floor(elapsed / 3600);
                const minutes = Math.floor((elapsed % 3600) / 60);
                const seconds = elapsed % 60;
                
                document.getElementById('timerDisplay').textContent = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                // 상태 업데이트
                const process = processes[currentProcessIndex];
                const standardMinutes = process?.standard_minutes || 60;
                const elapsedMinutes = elapsed / 60;
                const ratio = elapsedMinutes / standardMinutes;
                
                const statusEl = document.getElementById('statusMessage');
                const timerEl = document.getElementById('timerDisplay');
                
                if (ratio >= 1.5) {
                    statusEl.textContent = '⚠️ 심각한 지연!';
                    statusEl.className = 'text-lg font-bold mt-3 text-red-600';
                    timerEl.className = 'timer-display text-red-600';
                } else if (ratio >= 1.0) {
                    statusEl.textContent = '⏰ 표준시간 초과';
                    statusEl.className = 'text-lg font-bold mt-3 text-red-500';
                    timerEl.className = 'timer-display text-red-500';
                } else if (ratio >= 0.8) {
                    statusEl.textContent = '⚡ 표준시간 근접';
                    statusEl.className = 'text-lg font-bold mt-3 text-amber-500';
                    timerEl.className = 'timer-display text-amber-500';
                } else {
                    statusEl.textContent = '✓ 정상 진행 중';
                    statusEl.className = 'text-lg font-bold mt-3 text-emerald-600';
                    timerEl.className = 'timer-display text-emerald-600';
                }
            }, 1000);
        }

        // 타이머 정지
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // 스캔 초기화
        function resetScan() {
            stopTimer();
            currentCycle = null;
            currentProcessIndex = 0;
            processes = [];
            processStartTime = null;
            cycleStartTime = null;
            
            document.getElementById('scanSection').classList.remove('hidden');
            document.getElementById('processSection').classList.add('hidden');
            document.getElementById('barcodeInput').value = '';
            document.getElementById('barcodeInput').focus();
        }

        // 토스트 메시지
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const colors = {
                error: 'bg-red-500',
                success: 'bg-green-500',
                info: 'bg-blue-500'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast ${colors[type] || colors.info}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        // 로딩 표시
        function showLoading(show) {
            let overlay = document.getElementById('loadingOverlay');
            if (show) {
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'loadingOverlay';
                    overlay.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50';
                    overlay.innerHTML = '<div class="bg-white p-8 rounded-2xl"><i class="fas fa-spinner fa-spin text-4xl text-emerald-500"></i></div>';
                    document.body.appendChild(overlay);
                }
            } else if (overlay) {
                overlay.remove();
            }
        }

        // 페이지 로드
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('barcodeInput').focus();
        });
    </script>
</body>
</html>
