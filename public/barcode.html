<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>바코드 재고관리 - 본비반트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overscroll-behavior: none;
        }
        .scan-input {
            font-size: 18px;
            padding: 16px;
            border: 3px solid #3b82f6;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .scan-input:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3);
        }
        .item-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .item-card:active {
            transform: scale(0.98);
        }
        .qty-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .qty-btn:active {
            transform: scale(0.9);
        }
        .qty-input {
            width: 80px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
        }
        .action-btn {
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            background: #f3f4f6;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 sticky top-0 z-50">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-barcode text-2xl"></i>
                <div>
                    <h1 class="text-lg font-bold">바코드 재고관리</h1>
                    <p class="text-xs text-blue-200">본비반트 ERP</p>
                </div>
            </div>
            <button onclick="showHistory()" class="p-2 bg-white/20 rounded-lg">
                <i class="fas fa-history text-xl"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 pb-32">
        <!-- ★★★ v3.6.76: 현재 모드 인디케이터 ★★★ -->
        <div id="currentModeIndicator" class="mb-3 py-3 px-4 rounded-xl text-center font-bold text-white text-lg shadow-lg bg-red-500">
            🔴 사용모드 (스캔 시 포장단위 자동 차감)
        </div>
        
        <!-- Barcode Input Section -->
        <div class="bg-white rounded-2xl p-4 shadow-lg mb-4">
            <label class="block text-sm font-medium text-gray-600 mb-2">
                <i class="fas fa-qrcode mr-1"></i> 바코드 스캔/입력
            </label>
            <input type="text" id="barcodeInput" class="scan-input w-full" 
                   placeholder="바코드를 스캔하세요"
                   inputmode="numeric"
                   autocomplete="off"
                   autofocus>
            <p class="text-xs text-gray-400 mt-2 text-center">
                <i class="fas fa-info-circle mr-1"></i>
                <span id="scanModeHint">사용모드: 스캔 즉시 포장단위만큼 자동 차감됩니다</span>
            </p>
        </div>

        <!-- Tabs -->
        <div class="flex rounded-xl overflow-hidden mb-4 shadow">
            <button class="tab-btn active" data-tab="usage" onclick="switchTab('usage')">
                <i class="fas fa-minus-circle mr-1"></i> 사용
            </button>
            <button class="tab-btn" data-tab="manual" onclick="switchTab('manual')">
                <i class="fas fa-edit mr-1"></i> 수기
            </button>
            <!-- ★★★ v3.6.141: 입고 탭 제거 - 바코드 모드는 사용/수기/조회만 ★★★ -->
            <button class="tab-btn" data-tab="query" onclick="switchTab('query')">
                <i class="fas fa-search mr-1"></i> 조회
            </button>
        </div>
        
        <!-- ★★★ v3.6.81: 수기등록 섹션 ★★★ -->
        <div id="manualSection" class="hidden">
            <div class="bg-white rounded-2xl p-4 shadow-lg mb-4">
                <label class="block text-sm font-medium text-gray-600 mb-2">
                    <i class="fas fa-search mr-1"></i> 품목 검색 (이름 또는 코드)
                </label>
                <input type="text" id="manualSearchInput" class="w-full p-3 border-2 border-gray-200 rounded-xl text-base" 
                       placeholder="품목명 또는 코드 입력..."
                       autocomplete="off">
                
                <!-- 검색 결과 목록 -->
                <div id="searchResults" class="mt-3 max-h-60 overflow-y-auto hidden">
                    <!-- 검색 결과가 여기에 표시됩니다 -->
                </div>
            </div>
            
            <!-- 선택된 품목 정보 -->
            <div id="manualSelectedItem" class="hidden">
                <div class="item-card">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span id="manualItemCategory" class="badge bg-blue-100 text-blue-700 mb-1">원료</span>
                            <h3 id="manualItemName" class="text-lg font-bold text-gray-800">품목명</h3>
                            <p id="manualItemCode" class="text-sm text-gray-500">코드: -</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500">현재고</p>
                            <p id="manualCurrentStock" class="text-2xl font-bold text-blue-600">0</p>
                            <p id="manualStockUnit" class="text-sm text-gray-500">kg</p>
                        </div>
                    </div>
                    
                    <!-- ★★★ v3.6.82: 날짜 선택 ★★★ -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-600 mb-2">
                            <i class="fas fa-calendar-alt mr-1"></i> 사용일자
                        </label>
                        <div class="flex gap-2">
                            <input type="date" id="manualDateInput" class="flex-1 p-3 border-2 border-gray-200 rounded-xl text-base">
                            <button onclick="setManualDateToday()" class="px-4 py-2 bg-blue-100 text-blue-700 rounded-xl text-sm font-medium">오늘</button>
                            <button onclick="setManualDateYesterday()" class="px-4 py-2 bg-orange-100 text-orange-700 rounded-xl text-sm font-medium">어제</button>
                        </div>
                    </div>
                    
                    <!-- 수량 입력 -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-600 mb-2">
                            <i class="fas fa-balance-scale mr-1"></i> 사용 수량
                        </label>
                        <div class="flex items-center justify-center gap-4">
                            <button class="qty-btn bg-red-100 text-red-600" onclick="adjustManualQty(-1)">-</button>
                            <input type="number" id="manualQtyInput" class="qty-input" value="1" step="0.1" min="0">
                            <button class="qty-btn bg-green-100 text-green-600" onclick="adjustManualQty(1)">+</button>
                        </div>
                    </div>
                    
                    <!-- 빠른 수량 버튼 -->
                    <div class="flex gap-2 mb-4 flex-wrap justify-center">
                        <button onclick="setManualQty(0.5)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">0.5</button>
                        <button onclick="setManualQty(1)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">1</button>
                        <button onclick="setManualQty(5)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">5</button>
                        <button onclick="setManualQty(10)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">10</button>
                        <button onclick="setManualQty(25)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">25</button>
                    </div>
                    
                    <!-- 메모 -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-600 mb-2">
                            <i class="fas fa-comment mr-1"></i> 메모 (선택)
                        </label>
                        <input type="text" id="manualMemoInput" class="w-full p-3 border-2 border-gray-200 rounded-xl" 
                               placeholder="사용 용도 입력">
                    </div>
                    
                    <!-- 등록 버튼 -->
                    <button onclick="submitManualUsage()" class="action-btn bg-orange-500 text-white w-full">
                        <i class="fas fa-check mr-2"></i> 수기 사용 등록
                    </button>
                </div>
            </div>
            
            <!-- 안내 메시지 -->
            <div id="manualEmptyState" class="text-center py-8">
                <i class="fas fa-edit text-5xl text-gray-300 mb-4"></i>
                <p class="text-gray-500">품목을 검색하여 선택하세요</p>
                <p class="text-gray-400 text-sm mt-2">바코드 없이 수기로 사용량을 등록합니다</p>
            </div>
        </div>

        <!-- Scanned Item Display -->
        <div id="scannedItem" class="hidden">
            <div class="item-card">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <span id="itemCategory" class="badge bg-blue-100 text-blue-700 mb-1">원료</span>
                        <h3 id="itemName" class="text-lg font-bold text-gray-800">품목명</h3>
                        <p id="itemCode" class="text-sm text-gray-500">코드: -</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-500">현재고</p>
                        <p id="currentStock" class="text-2xl font-bold text-blue-600">0</p>
                        <p id="stockUnit" class="text-sm text-gray-500">kg</p>
                    </div>
                </div>
                
                <!-- LOT Selection (for usage) -->
                <div id="lotSection" class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-2">
                        <i class="fas fa-layer-group mr-1"></i> LOT 선택 (선입선출)
                    </label>
                    <select id="lotSelect" class="w-full p-3 border-2 border-gray-200 rounded-xl text-base">
                        <option value="">LOT를 선택하세요</option>
                    </select>
                </div>

                <!-- Quantity Input -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-2">
                        <i class="fas fa-balance-scale mr-1"></i> 수량
                    </label>
                    <div class="flex items-center justify-center gap-4">
                        <button class="qty-btn bg-red-100 text-red-600" onclick="adjustQty(-1)">-</button>
                        <input type="number" id="qtyInput" class="qty-input" value="1" step="0.1" min="0">
                        <button class="qty-btn bg-green-100 text-green-600" onclick="adjustQty(1)">+</button>
                    </div>
                </div>

                <!-- Quick Qty Buttons -->
                <div class="flex gap-2 mb-4 flex-wrap justify-center">
                    <button onclick="setQty(0.5)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">0.5</button>
                    <button onclick="setQty(1)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">1</button>
                    <button onclick="setQty(5)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">5</button>
                    <button onclick="setQty(10)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">10</button>
                    <button onclick="setQty(25)" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">25</button>
                </div>

                <!-- Memo -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-2">
                        <i class="fas fa-comment mr-1"></i> 메모 (선택)
                    </label>
                    <input type="text" id="memoInput" class="w-full p-3 border-2 border-gray-200 rounded-xl" 
                           placeholder="사용 용도 입력">
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
            <i class="fas fa-barcode text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">바코드를 스캔하세요</p>
            <p class="text-gray-400 text-sm mt-2">스캔한 품목이 여기에 표시됩니다</p>
        </div>

        <!-- Not Found State -->
        <div id="notFoundState" class="hidden text-center py-8">
            <div class="bg-yellow-50 rounded-2xl p-6">
                <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-3"></i>
                <p class="text-gray-700 font-medium mb-1">등록되지 않은 바코드</p>
                <p id="notFoundBarcode" class="text-gray-500 text-sm font-mono mb-4">-</p>
                <button onclick="showRegisterModal()" class="action-btn bg-yellow-500 text-white w-full">
                    <i class="fas fa-plus"></i> 바코드 등록하기
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Action Button -->
    <div id="actionSection" class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t shadow-lg hidden">
        <button id="actionBtn" onclick="submitAction()" class="action-btn bg-blue-600 text-white w-full">
            <i class="fas fa-check"></i> <span id="actionBtnText">사용 등록</span>
        </button>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="fixed inset-0 bg-black/50 z-50 hidden">
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl max-h-[80vh] overflow-hidden">
            <div class="sticky top-0 bg-white p-4 border-b flex justify-between items-center">
                <h2 class="text-lg font-bold">스캔 이력</h2>
                <button onclick="closeHistory()" class="p-2">
                    <i class="fas fa-times text-xl text-gray-500"></i>
                </button>
            </div>
            <div id="historyList" class="overflow-y-auto max-h-[60vh] p-4">
                <!-- History items will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="bg-white rounded-2xl p-6 text-center">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-3"></i>
            <p class="text-gray-700 font-medium">처리 중...</p>
        </div>
    </div>

    <script>
        // Global state
        let currentItem = null;
        let currentTab = 'usage';
        let scanHistory = JSON.parse(localStorage.getItem('bv_scan_history') || '[]');

        // API base
        const API_BASE = '/api';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const barcodeInput = document.getElementById('barcodeInput');
            
            // Auto-focus on barcode input
            barcodeInput.focus();
            
            // ★★★ v3.6.83: 중복 스캔 방지 플래그 ★★★
            let isProcessing = false;
            let scanTimeout;
            
            // Handle barcode input (from scanner app or manual)
            barcodeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(scanTimeout); // input 이벤트의 타이머 취소
                    
                    if (!isProcessing) {
                        isProcessing = true;
                        handleBarcodeScan(barcodeInput.value.trim()).finally(() => {
                            setTimeout(() => { isProcessing = false; }, 500);
                        });
                    }
                }
            });
            
            // Also handle input event for scanners that don't send Enter
            barcodeInput.addEventListener('input', (e) => {
                clearTimeout(scanTimeout);
                const value = e.target.value.trim();
                
                // If barcode length is typical (8-14 digits), auto-search after brief delay
                // ★★★ v3.6.83: Enter로 처리된 경우 중복 방지 ★★★
                if (value.length >= 8 && !isProcessing) {
                    scanTimeout = setTimeout(() => {
                        if (!isProcessing) {
                            isProcessing = true;
                            handleBarcodeScan(value).finally(() => {
                                setTimeout(() => { isProcessing = false; }, 500);
                            });
                        }
                    }, 300);
                }
            });
            
            // Keep focus on input
            document.addEventListener('click', (e) => {
                if (!e.target.closest('input, button, select, a')) {
                    barcodeInput.focus();
                }
            });
        });

        // ★★★ v3.6.76: Handle barcode scan - AUTO DEDUCT in usage mode ★★★
        async function handleBarcodeScan(barcode) {
            if (!barcode) return;
            
            console.log('Scanning barcode:', barcode, 'Mode:', currentTab);
            showLoading(true);
            
            try {
                // Search for item by barcode
                const response = await fetch(`${API_BASE}/barcode/scan?barcode=${encodeURIComponent(barcode)}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    currentItem = result.data;
                    
                    // ★★★ v3.6.78: 사용모드 - 포장단위(pack_unit) 기준 자동 차감 ★★★
                    if (currentTab === 'usage') {
                        const deductQty = result.data.pack_unit || 1;  // pack_unit 없으면 1 기본값
                        await autoDeductUsage(result.data, deductQty);
                    } else {
                        // 입고/조회 모드: 품목 표시만
                        displayItem(result.data);
                        showToast(`${result.data.item_name} 조회 완료`, 'success');
                    }
                    
                    // Add to history
                    addToHistory(barcode, result.data);
                } else {
                    showNotFound(barcode);
                    showToast('등록되지 않은 바코드입니다', 'warning');
                }
            } catch (error) {
                console.error('Scan error:', error);
                showToast('조회 실패: ' + error.message, 'error');
            } finally {
                showLoading(false);
                // Clear input and refocus
                document.getElementById('barcodeInput').value = '';
                document.getElementById('barcodeInput').focus();
            }
        }
        
        // ★★★ v3.6.78: 포장단위 기준 자동 사용 차감 함수 ★★★
        async function autoDeductUsage(item, qty) {
            try {
                const unit = item.unit || 'kg';
                const packUnitName = item.pack_unit_name || '';
                const payload = {
                    item_code: item.item_code,
                    quantity: qty,
                    lot_number: null,
                    memo: packUnitName ? `바코드 스캔 자동차감 (1${packUnitName})` : '바코드 스캔 자동차감'
                };
                
                const response = await fetch(`${API_BASE}/barcode/usage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Update current stock
                    item.current_stock = (item.current_stock || 0) - qty;
                    currentItem = item;
                    
                    displayItem(item);
                    
                    // 성공 피드백 (진동)
                    const unit = item.unit || 'kg';
                    const packUnitName = item.pack_unit_name;
                    const displayQty = packUnitName ? `1${packUnitName}(${qty}${unit})` : `${qty}${unit}`;
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    showToast(`✅ ${item.item_name} ${displayQty} 차감! (잔량: ${formatNumber(item.current_stock)}${unit})`, 'success');
                    
                    // BroadcastChannel 알림
                    try {
                        const channel = new BroadcastChannel('bv_barcode_sync');
                        channel.postMessage({
                            type: 'usage',
                            item_code: item.item_code,
                            item_name: item.item_name,
                            quantity: qty,
                            new_stock: item.current_stock,
                            timestamp: new Date().toISOString()
                        });
                        channel.close();
                    } catch (e) {}
                    
                    addToHistory(item.barcode || item.item_code, item, 'usage', qty);
                } else {
                    displayItem(item);
                    showToast(`⚠️ 차감실패: ${result.error || '재고부족'}`, 'error');
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            } catch (error) {
                console.error('Auto deduct error:', error);
                displayItem(item);
                showToast(`⚠️ 오류: ${error.message}`, 'error');
            }
        }

        // Display scanned item
        function displayItem(item) {
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('notFoundState').classList.add('hidden');
            document.getElementById('scannedItem').classList.remove('hidden');
            document.getElementById('actionSection').classList.remove('hidden');
            
            // Fill item data
            document.getElementById('itemName').textContent = item.item_name;
            document.getElementById('itemCode').textContent = `코드: ${item.item_code}`;
            document.getElementById('currentStock').textContent = formatNumber(item.current_stock || 0);
            document.getElementById('stockUnit').textContent = item.unit || 'ea';
            
            // Category badge
            const categoryEl = document.getElementById('itemCategory');
            categoryEl.textContent = item.category || '원료';
            if (item.category === '제품') {
                categoryEl.className = 'badge bg-purple-100 text-purple-700 mb-1';
            } else if (item.category === '부자재') {
                categoryEl.className = 'badge bg-green-100 text-green-700 mb-1';
            } else {
                categoryEl.className = 'badge bg-blue-100 text-blue-700 mb-1';
            }
            
            // Load LOT list for usage tab
            if (currentTab === 'usage' && item.lots && item.lots.length > 0) {
                document.getElementById('lotSection').classList.remove('hidden');
                const lotSelect = document.getElementById('lotSelect');
                lotSelect.innerHTML = '<option value="">자동 선택 (선입선출)</option>' +
                    item.lots.map(lot => `
                        <option value="${lot.lot_number}">
                            ${lot.lot_number} | 잔량: ${formatNumber(lot.remain_qty)} | 유효: ${lot.expiry_date || '-'}
                        </option>
                    `).join('');
            } else {
                document.getElementById('lotSection').classList.add('hidden');
            }
            
            // Reset quantity
            document.getElementById('qtyInput').value = '1';
            document.getElementById('memoInput').value = '';
            
            updateActionButton();
        }

        // Show not found state
        function showNotFound(barcode) {
            currentItem = null;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('scannedItem').classList.add('hidden');
            document.getElementById('actionSection').classList.add('hidden');
            document.getElementById('notFoundState').classList.remove('hidden');
            document.getElementById('notFoundBarcode').textContent = barcode;
        }

        // ★★★ v3.6.76: Switch tab with visual feedback and mode hint update ★★★
        // ★★★ v3.6.81: 수기등록용 변수 ★★★
        let manualSelectedItem = null;
        let searchTimeout = null;
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            
            // Update mode indicator
            const indicator = document.getElementById('currentModeIndicator');
            const hint = document.getElementById('scanModeHint');
            
            // ★★★ v3.6.81: 수기등록 탭 추가 ★★★
            // 바코드 입력창과 수기등록 섹션 토글
            const barcodeSection = document.querySelector('.bg-white.rounded-2xl.p-4.shadow-lg.mb-4');
            const manualSection = document.getElementById('manualSection');
            const scannedItem = document.getElementById('scannedItem');
            const emptyState = document.getElementById('emptyState');
            const actionSection = document.getElementById('actionSection');
            
            if (tab === 'manual') {
                // 수기등록 모드
                indicator.className = 'mb-3 py-3 px-4 rounded-xl text-center font-bold text-white text-lg shadow-lg bg-orange-500';
                indicator.innerHTML = '🟠 수기모드 (품목 검색 후 사용량 등록)';
                hint.textContent = '수기모드: 품목을 검색하여 사용량을 등록합니다';
                
                // 바코드 입력창 숨기기, 수기등록 섹션 표시
                if (barcodeSection) barcodeSection.classList.add('hidden');
                manualSection.classList.remove('hidden');
                scannedItem.classList.add('hidden');
                emptyState.classList.add('hidden');
                actionSection.classList.add('hidden');
                
                // 수기 검색 입력창에 포커스
                setTimeout(() => document.getElementById('manualSearchInput')?.focus(), 100);
            } else {
                // 바코드 모드들
                if (barcodeSection) barcodeSection.classList.remove('hidden');
                manualSection.classList.add('hidden');
                
                if (tab === 'usage') {
                    indicator.className = 'mb-3 py-3 px-4 rounded-xl text-center font-bold text-white text-lg shadow-lg bg-red-500';
                    indicator.innerHTML = '🔴 사용모드 (스캔 시 포장단위 자동 차감)';
                    hint.textContent = '사용모드: 스캔 즉시 포장단위만큼 자동 차감됩니다';
                } else if (tab === 'inbound') {
                    indicator.className = 'mb-3 py-3 px-4 rounded-xl text-center font-bold text-white text-lg shadow-lg bg-green-500';
                    indicator.innerHTML = '🟢 입고모드 (스캔 후 수량 입력 필요)';
                    hint.textContent = '입고모드: 스캔 후 수량을 입력하고 등록하세요';
                } else if (tab === 'query') {
                    indicator.className = 'mb-3 py-3 px-4 rounded-xl text-center font-bold text-white text-lg shadow-lg bg-blue-500';
                    indicator.innerHTML = '🔵 조회모드 (재고 및 이력 확인)';
                    hint.textContent = '조회모드: 품목의 재고와 이력을 확인합니다';
                }
                
                // 바코드 입력창에 포커스
                setTimeout(() => document.getElementById('barcodeInput')?.focus(), 100);
            }
            
            // Vibrate on mobile
            if (navigator.vibrate) navigator.vibrate(50);
            
            // Update LOT section visibility
            if (currentItem) {
                if (tab === 'usage' && currentItem.lots && currentItem.lots.length > 0) {
                    document.getElementById('lotSection').classList.remove('hidden');
                } else {
                    document.getElementById('lotSection').classList.add('hidden');
                }
            }
            
            updateActionButton();
        }
        
        // ★★★ v3.6.81: 수기등록 - 품목 검색 ★★★
        document.addEventListener('DOMContentLoaded', () => {
            const manualSearchInput = document.getElementById('manualSearchInput');
            if (manualSearchInput) {
                manualSearchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    const query = e.target.value.trim();
                    
                    if (query.length >= 1) {
                        searchTimeout = setTimeout(() => {
                            searchItems(query);
                        }, 300);
                    } else {
                        document.getElementById('searchResults').classList.add('hidden');
                    }
                });
            }
        });
        
        // ★★★ v3.6.81: 품목 검색 API 호출 ★★★
        async function searchItems(query) {
            try {
                const response = await fetch(`${API_BASE}/items/search?q=${encodeURIComponent(query)}&limit=20`);
                const result = await response.json();
                
                const searchResults = document.getElementById('searchResults');
                
                if (result.success && result.data && result.data.length > 0) {
                    searchResults.innerHTML = result.data.map(item => `
                        <div class="p-3 border-b border-gray-100 cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition-colors"
                             onclick="selectManualItem('${item.item_code}', '${item.item_name.replace(/'/g, "\\'")}', ${item.current_stock || 0}, '${item.unit || 'kg'}', '${item.category || '원료'}')">
                            <div class="flex justify-between items-center">
                                <div>
                                    <span class="badge ${item.category === '제품' ? 'bg-purple-100 text-purple-700' : item.category === '부자재' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'} text-xs mr-2">${item.category || '원료'}</span>
                                    <span class="font-medium text-gray-800">${item.item_name}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-sm text-gray-500">${formatNumber(item.current_stock || 0)} ${item.unit || 'kg'}</span>
                                </div>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">${item.item_code}</p>
                        </div>
                    `).join('');
                    searchResults.classList.remove('hidden');
                } else {
                    searchResults.innerHTML = '<p class="p-3 text-center text-gray-500">검색 결과가 없습니다</p>';
                    searchResults.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Search error:', error);
                showToast('검색 실패', 'error');
            }
        }
        
        // ★★★ v3.6.81: 품목 선택 ★★★
        function selectManualItem(itemCode, itemName, currentStock, unit, category) {
            manualSelectedItem = {
                item_code: itemCode,
                item_name: itemName,
                current_stock: currentStock,
                unit: unit,
                category: category
            };
            
            // 검색 결과 숨기기
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('manualSearchInput').value = '';
            document.getElementById('manualEmptyState').classList.add('hidden');
            
            // 선택된 품목 표시
            const selectedSection = document.getElementById('manualSelectedItem');
            selectedSection.classList.remove('hidden');
            
            document.getElementById('manualItemName').textContent = itemName;
            document.getElementById('manualItemCode').textContent = `코드: ${itemCode}`;
            document.getElementById('manualCurrentStock').textContent = formatNumber(currentStock);
            document.getElementById('manualStockUnit').textContent = unit;
            
            const categoryEl = document.getElementById('manualItemCategory');
            categoryEl.textContent = category;
            if (category === '제품') {
                categoryEl.className = 'badge bg-purple-100 text-purple-700 mb-1';
            } else if (category === '부자재') {
                categoryEl.className = 'badge bg-green-100 text-green-700 mb-1';
            } else {
                categoryEl.className = 'badge bg-blue-100 text-blue-700 mb-1';
            }
            
            // ★★★ v3.6.82: 날짜 초기화 (오늘) ★★★
            setManualDateToday();
            
            // 수량 초기화
            document.getElementById('manualQtyInput').value = '1';
            document.getElementById('manualMemoInput').value = '';
            
            showToast(`${itemName} 선택됨`, 'success');
        }
        
        // ★★★ v3.6.82: 날짜 설정 함수들 ★★★
        function setManualDateToday() {
            const today = new Date();
            document.getElementById('manualDateInput').value = formatDateForInput(today);
        }
        
        function setManualDateYesterday() {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            document.getElementById('manualDateInput').value = formatDateForInput(yesterday);
        }
        
        function formatDateForInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        // ★★★ v3.6.82: 수기 사용 등록 제출 (날짜 포함) ★★★
        async function submitManualUsage() {
            if (!manualSelectedItem) {
                showToast('품목을 먼저 선택하세요', 'warning');
                return;
            }
            
            const qty = parseFloat(document.getElementById('manualQtyInput').value) || 0;
            if (qty <= 0) {
                showToast('수량을 입력하세요', 'warning');
                return;
            }
            
            // ★★★ v3.6.82: 날짜 가져오기 ★★★
            const selectedDate = document.getElementById('manualDateInput').value;
            if (!selectedDate) {
                showToast('날짜를 선택하세요', 'warning');
                return;
            }
            
            const memo = document.getElementById('manualMemoInput').value.trim() || '수기 사용등록';
            
            showLoading(true);
            
            try {
                const payload = {
                    item_code: manualSelectedItem.item_code,
                    quantity: qty,
                    lot_number: null,
                    memo: memo,
                    trans_date: selectedDate  // ★★★ v3.6.82: 날짜 전달 ★★★
                };
                
                const response = await fetch(`${API_BASE}/barcode/usage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 재고 업데이트
                    manualSelectedItem.current_stock = (manualSelectedItem.current_stock || 0) - qty;
                    document.getElementById('manualCurrentStock').textContent = formatNumber(manualSelectedItem.current_stock);
                    
                    // 성공 피드백
                    const unit = manualSelectedItem.unit || 'kg';
                    const dateDisplay = selectedDate === formatDateForInput(new Date()) ? '오늘' : selectedDate;
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    showToast(`✅ ${manualSelectedItem.item_name} ${qty}${unit} 차감! (${dateDisplay})`, 'success');
                    
                    // BroadcastChannel 알림
                    try {
                        const channel = new BroadcastChannel('bv_barcode_sync');
                        channel.postMessage({
                            type: 'usage',
                            item_code: manualSelectedItem.item_code,
                            item_name: manualSelectedItem.item_name,
                            quantity: qty,
                            new_stock: manualSelectedItem.current_stock,
                            trans_date: selectedDate,
                            timestamp: new Date().toISOString()
                        });
                        channel.close();
                    } catch (e) {}
                    
                    // 히스토리 추가
                    addToHistory(manualSelectedItem.item_code, manualSelectedItem, 'usage', qty);
                    
                    // 입력 초기화
                    document.getElementById('manualQtyInput').value = '1';
                    document.getElementById('manualMemoInput').value = '';
                } else {
                    showToast(`⚠️ 차감실패: ${result.error || '재고부족'}`, 'error');
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            } catch (error) {
                console.error('Manual usage error:', error);
                showToast(`⚠️ 오류: ${error.message}`, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // ★★★ v3.6.81: 수기등록 수량 조절 ★★★
        function adjustManualQty(delta) {
            const input = document.getElementById('manualQtyInput');
            let value = parseFloat(input.value) || 0;
            value = Math.max(0, value + delta);
            input.value = value;
        }
        
        function setManualQty(value) {
            document.getElementById('manualQtyInput').value = value;
        }

        // Update action button text
        function updateActionButton() {
            const btnText = document.getElementById('actionBtnText');
            const btn = document.getElementById('actionBtn');
            
            switch(currentTab) {
                case 'usage':
                    btnText.innerHTML = '<i class="fas fa-minus-circle mr-2"></i>사용 등록 (재고 차감)';
                    btn.className = 'action-btn bg-red-500 text-white w-full';
                    break;
                case 'inbound':
                    btnText.innerHTML = '<i class="fas fa-plus-circle mr-2"></i>입고 등록 (재고 증가)';
                    btn.className = 'action-btn bg-green-500 text-white w-full';
                    break;
                case 'query':
                    btnText.innerHTML = '<i class="fas fa-history mr-2"></i>이력 조회';
                    btn.className = 'action-btn bg-blue-500 text-white w-full';
                    break;
            }
        }

        // Adjust quantity
        function adjustQty(delta) {
            const input = document.getElementById('qtyInput');
            let value = parseFloat(input.value) || 0;
            value = Math.max(0, value + delta);
            input.value = value;
        }

        // Set quantity
        function setQty(value) {
            document.getElementById('qtyInput').value = value;
        }

        // Submit action
        async function submitAction() {
            if (!currentItem) {
                showToast('품목을 먼저 스캔하세요', 'warning');
                return;
            }
            
            const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
            if (qty <= 0) {
                showToast('수량을 입력하세요', 'warning');
                return;
            }
            
            const memo = document.getElementById('memoInput').value.trim();
            const lotNumber = document.getElementById('lotSelect')?.value || null;
            
            showLoading(true);
            
            try {
                let endpoint, payload;
                
                switch(currentTab) {
                    case 'usage':
                        endpoint = `${API_BASE}/barcode/usage`;
                        payload = {
                            item_code: currentItem.item_code,
                            quantity: qty,
                            lot_number: lotNumber,
                            memo: memo || '바코드 스캔 사용등록'
                        };
                        break;
                    case 'inbound':
                        endpoint = `${API_BASE}/barcode/inbound`;
                        payload = {
                            item_code: currentItem.item_code,
                            quantity: qty,
                            memo: memo || '바코드 스캔 입고등록'
                        };
                        break;
                    case 'query':
                        // Show history for this item
                        showItemHistory(currentItem.item_code);
                        showLoading(false);
                        return;
                }
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast(result.message || '등록 완료!', 'success');
                    
                    // Update current stock display
                    if (currentTab === 'usage') {
                        currentItem.current_stock = (currentItem.current_stock || 0) - qty;
                    } else if (currentTab === 'inbound') {
                        currentItem.current_stock = (currentItem.current_stock || 0) + qty;
                    }
                    document.getElementById('currentStock').textContent = formatNumber(currentItem.current_stock);
                    
                    // ★★★ v3.6.58: 다른 탭에 실시간 알림 (BroadcastChannel) ★★★
                    try {
                        const channel = new BroadcastChannel('bv_barcode_sync');
                        channel.postMessage({
                            type: currentTab, // 'usage' or 'inbound'
                            item_code: currentItem.item_code,
                            item_name: currentItem.item_name,
                            quantity: qty,
                            new_stock: currentItem.current_stock,
                            timestamp: new Date().toISOString()
                        });
                        channel.close();
                    } catch (e) {
                        console.log('BroadcastChannel not supported');
                    }
                    
                    // Add to history
                    addToHistory(currentItem.barcode || currentItem.item_code, currentItem, currentTab, qty);
                    
                    // Reset
                    document.getElementById('qtyInput').value = '1';
                    document.getElementById('memoInput').value = '';
                } else {
                    showToast(result.error || '등록 실패', 'error');
                }
            } catch (error) {
                console.error('Submit error:', error);
                showToast('처리 실패: ' + error.message, 'error');
            } finally {
                showLoading(false);
                document.getElementById('barcodeInput').focus();
            }
        }

        // Add to local history
        function addToHistory(barcode, item, action = 'scan', qty = null) {
            const historyItem = {
                barcode,
                item_code: item.item_code,
                item_name: item.item_name,
                action,
                qty,
                timestamp: new Date().toISOString()
            };
            
            scanHistory.unshift(historyItem);
            scanHistory = scanHistory.slice(0, 100); // Keep last 100
            localStorage.setItem('bv_scan_history', JSON.stringify(scanHistory));
        }

        // Show history modal
        function showHistory() {
            const historyList = document.getElementById('historyList');
            
            if (scanHistory.length === 0) {
                historyList.innerHTML = '<p class="text-center text-gray-500 py-8">스캔 이력이 없습니다</p>';
            } else {
                historyList.innerHTML = scanHistory.map(h => {
                    const time = new Date(h.timestamp).toLocaleString('ko-KR');
                    const actionBadge = h.action === 'usage' ? 
                        '<span class="badge bg-red-100 text-red-700">사용</span>' :
                        h.action === 'inbound' ?
                        '<span class="badge bg-green-100 text-green-700">입고</span>' :
                        '<span class="badge bg-gray-100 text-gray-700">조회</span>';
                    
                    return `
                        <div class="history-item">
                            <div>
                                <p class="font-medium text-gray-800">${h.item_name}</p>
                                <p class="text-sm text-gray-500">${h.barcode}</p>
                                <p class="text-xs text-gray-400">${time}</p>
                            </div>
                            <div class="text-right">
                                ${actionBadge}
                                ${h.qty ? `<p class="font-bold mt-1">${h.action === 'usage' ? '-' : '+'}${h.qty}</p>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            document.getElementById('historyModal').classList.remove('hidden');
        }

        // Close history modal
        function closeHistory() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        // Show item transaction history
        async function showItemHistory(itemCode) {
            showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/barcode/history?item_code=${encodeURIComponent(itemCode)}`);
                const result = await response.json();
                
                // TODO: Show in modal
                console.log('Item history:', result);
                showToast('이력 조회 완료 (콘솔 확인)', 'info');
            } catch (error) {
                showToast('이력 조회 실패', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Show register modal (for unknown barcodes)
        function showRegisterModal() {
            const barcode = document.getElementById('notFoundBarcode').textContent;
            // Redirect to main ERP barcode registration
            if (confirm(`바코드 "${barcode}"를 등록하시겠습니까?\n\nERP 관리자 화면으로 이동합니다.`)) {
                window.open(`/?barcode=${encodeURIComponent(barcode)}#admin`, '_blank');
            }
        }

        // Show loading overlay
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
        }

        // Show toast message
        function showToast(message, type = 'info') {
            // Remove existing toast
            document.querySelectorAll('.toast').forEach(t => t.remove());
            
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast ${colors[type] || colors.info}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        // Format number
        function formatNumber(num) {
            if (num === null || num === undefined) return '0';
            return parseFloat(num).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
        }
    </script>
</body>
</html>
